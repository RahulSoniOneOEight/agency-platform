name: H2 Candidate Build

# Builds one immutable H.2 release candidate: the exact Flutter Web artifact, a
# canonical artifact manifest, and a candidate identity binding source SHA,
# artifact digest, migration set, and release-config identity. This workflow
# only builds and uploads artifacts; it performs no release action beyond that.

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: Build version bound into the candidate
        required: false
        default: 0.1.0+h2rc1
  push:
    branches-ignore:
      - main

permissions:
  contents: read

env:
  BUILD_VERSION: ${{ inputs.build_version || '0.1.0+h2rc1' }}

jobs:
  candidate-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Validate production config
        run: python -m tooling.production.validate_config client-projects/reference-commerce

      - name: Validate production migrations
        run: python -m tooling.production.validate_migrations

      - name: Verify H.1 production foundation report
        run: python -m tooling.production.report client-projects/reference-commerce

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build production app for web
        run: |
          cd apps/production_app
          flutter pub get
          flutter build web

      - name: Build candidate manifest and identity
        run: |
          python -m tooling.hardening.candidate client-projects/reference-commerce \
            --write \
            --artifact apps/production_app/build/web \
            --source-sha "${{ github.sha }}" \
            --build-version "$BUILD_VERSION"

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: h2-candidate-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            apps/production_app/build/web
            client-projects/reference-commerce/production/release/artifact-manifest.json
            client-projects/reference-commerce/production/release/candidate.json
