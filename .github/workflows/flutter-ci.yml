name: Flutter CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect initialized Flutter/Dart packages
        id: detect
        shell: bash
        run: |
          if find packages apps starters client-projects -name pubspec.yaml -print -quit 2>/dev/null | grep -q .; then
            echo "has_packages=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
            echo "No initialized Flutter/Dart packages yet; Flutter checks skipped."
          fi

      - name: Set up Flutter
        if: steps.detect.outputs.has_packages == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Analyze and test initialized packages
        if: steps.detect.outputs.has_packages == 'true'
        shell: bash
        run: |
          # `find packages apps starters client-projects` auto-discovers every
          # initialized Dart/Flutter package, so the H.2 provider-neutral core and
          # reference adapter packages under packages/ (agency_operations_core,
          # agency_cloudflare_adapter, agency_ga4_adapter, agency_sentry_adapter)
          # are analyzed and tested here with no credential or live deployment.
          set -euo pipefail
          while IFS= read -r pubspec; do
            dir="$(dirname "$pubspec")"
            echo "Checking $dir"
            (
              cd "$dir"
              flutter pub get || dart pub get
              if grep -q '^  flutter:' pubspec.yaml || grep -q '^flutter:' pubspec.yaml; then
                flutter analyze
                if [ -d test ]; then flutter test; fi
              else
                dart analyze
                if [ -d test ]; then dart test; fi
              fi
            )
          done < <(find packages apps starters client-projects -name pubspec.yaml -print)

      - name: Governed visual golden regression
        if: steps.detect.outputs.has_packages == 'true'
        shell: bash
        run: |
          # Deterministic golden regression gate. A mismatch fails CI and never
          # rewrites a baseline (baselines change only via a deliberate
          # `flutter test --update-goldens` run reviewed and committed by a human).
          if [ -d apps/widgetbook/test/golden ]; then
            cd apps/widgetbook
            flutter pub get
            flutter test test/golden
          fi

      - name: Build prototype app for web
        if: steps.detect.outputs.has_packages == 'true'
        shell: bash
        run: |
          if [ -f apps/prototype_app/pubspec.yaml ]; then
            cd apps/prototype_app
            flutter pub get
            flutter build web
          fi

      - name: Build production app for web
        if: steps.detect.outputs.has_packages == 'true'
        shell: bash
        run: |
          # H.1 production composition boots from committed client-safe config
          # assets (deterministic fakes for dev). No live Supabase project or
          # production credential is required for this build.
          if [ -f apps/production_app/pubspec.yaml ]; then
            cd apps/production_app
            flutter pub get
            flutter build web
          fi
