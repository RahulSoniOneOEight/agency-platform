name: Repository Validation

on:
  pull_request:
  push:
    branches:
      - main
      - step1-skeleton

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Run repository validator tests
        run: python -m unittest tooling.validation.test_validate_repo tooling.validation.test_knowledge_platform tooling.validation.test_workflow_runtime tooling.validation.test_client_input_contract tooling.validation.test_prototype_platform tooling.validation.test_prototype_workflow_integration tooling.validation.test_resource_selection tooling.validation.test_resource_integration tooling.validation.test_runtime_bundle tooling.validation.test_flutter_bindings tooling.validation.test_theme_contract tooling.validation.test_refinement_notes tooling.validation.test_visual_qa_capture tooling.validation.test_visual_qa_contracts tooling.validation.test_workflow_state_v2 tooling.validation.test_workflow_contracts tooling.validation.test_workflow_manifests tooling.validation.test_workflow_lease tooling.validation.test_workflow_audit tooling.validation.test_workflow_idempotency tooling.validation.test_workflow_recovery tooling.validation.test_workflow_runner tooling.validation.test_workflow_resume_e2e tooling.validation.test_workflow_authority_boundaries tooling.validation.test_reference_client_fixture tooling.validation.test_reference_client_scenario tooling.validation.test_reference_client_evidence tooling.validation.test_reference_client_change_scenarios tooling.validation.test_reference_client_resume_e2e tooling.validation.test_reference_client_report tooling.validation.test_production_authorization_models tooling.validation.test_production_authorization_repository tooling.validation.test_production_authorization_eligibility tooling.validation.test_production_authorization_coordinator tooling.validation.test_production_authorization_validity tooling.validation.test_production_authorization_evidence tooling.validation.test_production_authorization_reference_client tooling.validation.test_production_authorization_release_gate tooling.validation.test_production_authorization_authority_boundaries tooling.validation.test_production_config tooling.validation.test_production_migrations tooling.validation.test_h1_reference_report tooling.validation.test_h1_authority_boundaries -v

      - name: Validate required repository structure
        run: python tooling/validation/validate_repo.py

      - name: Validate knowledge platform
        run: python -m tooling.knowledge.validate_knowledge

      - name: Validate workflow runtime
        run: python -m tooling.workflow.validate_workflow

      - name: Validate prototype platform
        run: python -m tooling.prototype.validate_prototype

      - name: Validate deterministic visual QA contracts
        run: python -m tooling.prototype.validate_visual_qa client-projects/examples/prototype-demo

      - name: Validate reference client
        run: python -m tooling.reference_client.validate_reference_client client-projects/reference-commerce

      - name: Validate production authorization
        run: python -m tooling.production_authorization.validate client-projects/reference-commerce

      - name: Validate production config
        run: python -m tooling.production.validate_config client-projects/reference-commerce

      - name: Validate production migrations
        run: python -m tooling.production.validate_migrations

      - name: Validate production foundation (H.1 report + app contract evidence)
        run: python -m tooling.production.report client-projects/reference-commerce
