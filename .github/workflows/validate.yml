name: Repository Validation

on:
  pull_request:
  push:
    branches:
      - main
      - step1-skeleton

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install knowledge-platform validation dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Run repository validator tests
        run: python -m unittest tooling.validation.test_validate_repo tooling.validation.test_knowledge_platform -v

      - name: Validate required repository structure
        run: python tooling/validation/validate_repo.py

      - name: Validate knowledge platform
        run: python -m tooling.knowledge.validate_knowledge
