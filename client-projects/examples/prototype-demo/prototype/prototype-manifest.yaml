version: 1
client_id: prototype-demo
runtime: apps/prototype_app
default_direction: a
directions:
  a: prototype/runtime/direction-a.json
  b: prototype/runtime/direction-b.json
  c: prototype/runtime/direction-c.json
fixture_pack: prototype/fixtures/demo.yaml
theme:
  seed_color: '#6750A4'
review:
  query_parameter: direction
  allowed_values:
  - a
  - b
  - c
resources:
  asset.brand.logo:
    candidate_id: client-brand-logo
    type: image
    source: client
    asset:
      path: input/brand/brand-assets/logo.svg
  asset.home.hero:
    candidate_id: pexels-fixture-1001
    type: image
    source: pexels
    asset:
      url: https://images.pexels.com/photos/fixture/hero.jpg
      width: 2400
      height: 1350
  icon.commerce.cart:
    candidate_id: iconoir-cart
    type: icon
    source: agency
    asset:
      provider: iconoir
      name: cart
